# One-command stack: Ollama (local LLM server) + the Spring AI app.
#
#   docker compose up --build
#
# On the first run the ollama-pull service downloads granite4.1:3b (~2 GB) and
# nomic-embed-text (~274 MB); the app starts only after both are ready.
# The app's ./data directory (HSQLDB chat memory + persisted vector store) is
# mounted from the host, so conversations and embeddings survive restarts.
services:
  ollama:
    image: ollama/ollama:latest
    container_name: spring-ai-ollama
    volumes:
      - ./data/ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  ollama-pull:
    image: ollama/ollama:latest
    container_name: spring-ai-ollama-pull
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ./data/ollama:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "ollama pull granite4.1:3b && ollama pull nomic-embed-text"
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  # OIDC mode (spec 2026-09-25): identity provider. Runs always (start-dev is
  # cheap); the app only switches to it with APP_OIDC_ENABLED=true. The demo
  # client secret in infra/keycloak/realm-export.json is a demo credential,
  # like the changeme Postgres password below.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    container_name: spring-ai-keycloak
    command: start-dev --import-realm
    environment:
      KC_HEALTH_ENABLED: "true"
      # Frontend URL forced to the docker-network name so token iss, discovery
      # and the app's OIDC_ISSUER_URI are identical (spec §7); curl reaches the
      # token endpoint through the published 8081 port.
      KC_HOSTNAME: http://keycloak:8080
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}
    ports:
      # 8080 is taken by the app (127.0.0.1:8080:8080 above).
      - "127.0.0.1:8081:8080"
    volumes:
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  app:
    build: .
    container_name: spring-ai-ollama-demo
    ports:
      # Local development only. Put a TLS reverse proxy in front before exposing
      # this service to other hosts.
      - "127.0.0.1:8080:8080"
    environment:
      # Point the app at the Ollama container instead of localhost:11434.
      SPRING_AI_OLLAMA_BASEURL: http://ollama:11434
      # Optional: protect /ai/** with an X-API-Key header (empty = open).
      APP_API_KEY: ${APP_API_KEY:-}
      # Set SPRING_PROFILES_ACTIVE=prod for fail-fast auth + restricted CORS.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # Prod profile: PostgreSQL (chat memory + pgvector) via the db service.
      DATABASE_URL: ${DATABASE_URL:-}
      PG_USER: ${PG_USER:-ai}
      PG_PASSWORD: ${PG_PASSWORD:-changeme}
      # Prod profile: shared rate-limit backend via the redis service.
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      RATE_LIMIT_STORE: ${RATE_LIMIT_STORE:-}
      # OIDC mode: flip to true to require Bearer JWTs on /ai/** + metrics.
      APP_OIDC_ENABLED: ${APP_OIDC_ENABLED:-false}
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-http://keycloak:8080/realms/spring-ai-demo}
      OIDC_ALLOWED_AUDIENCES: ${OIDC_ALLOWED_AUDIENCES:-spring-ai-demo}
    volumes:
      # Must be writable by uid 1000 (the app user inside the image).
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy

    restart: unless-stopped

  # PostgreSQL + pgvector for the prod profile (chat memory + vector store).
  # Default (no SPRING_PROFILES_ACTIVE) still uses HSQLDB + JSON file.
  db:
    image: pgvector/pgvector:pg17
    container_name: spring-ai-postgres
    environment:
      POSTGRES_DB: ai_demo
      POSTGRES_USER: ${PG_USER:-ai}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-ai} -d ai_demo"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Shared rate-limit backend for the prod profile (app.rate-limit.store=redis).
  # Default (memory store) ignores it.
  redis:
    image: redis:7-alpine
    container_name: spring-ai-redis
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  redisdata: