name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit:
    name: Unit (no Spring, no Docker)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Fast unit tests
        run: ./mvnw -B test -Dtest='*UnitTest,ProdAuthGuardTest'

  integration:
    name: Integration (full suite + coverage gate)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: ./mvnw -B verify

  trivy:
    name: Vulnerability scan (fs + image configs)
    runs-on: ubuntu-latest
    needs: unit
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Scan repo and Dockerfiles
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          # Blocking now that the coordinated upgrade (Boot 3.5.16 / Spring AI
          # 1.1.8 / Alibaba 1.1.2.4-security-fix) is validated. Fixed-version
          # advisories are resolved or waived in .trivyignore (see ANALISE.md §27).
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
