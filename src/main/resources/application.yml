spring:
  application:
    name: spring-ai-ollama-demo
  # Persistence for multi-turn chat memory (JdbcChatMemoryRepository).
  # HSQLDB in file mode under ./data — conversations survive restarts.
  # For production: point spring.datasource.* at PostgreSQL (schema is created
  # automatically by the Spring AI JDBC chat-memory starter).
  datasource:
    url: jdbc:hsqldb:file:./data/chat-memory;ifexists=false
    username: sa
    password: ""
  autoconfigure:
    exclude:
      # pgvector auto-config would create a second VectorStore bean next to the
      # one built manually in RagConfig (and would fail on HSQLDB in dev/test).
      # RagConfig builds PgVectorStore explicitly when app.rag.store=pgvector.
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
      # DashScope auto-configurations instantiate API clients that require a non-blank
      # api-key at startup — even when DashScope is disabled (no DASHSCOPE_API_KEY).
      # This demo does not use them: the DashScopeChatModel is created manually in
      # DashScopeManualConfig only when a real key is set, and chat/embedding models
      # are explicitly pinned to Ollama below (spring.ai.model.*).
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeChatAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAgentAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeImageAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeVideoAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAudioSpeechAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAudioTranscriptionAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeRerankAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeEmbeddingAutoConfiguration
  ai:
    # Persistent multi-turn chat memory (JdbcChatMemoryRepository backed by the
    # file-based HSQLDB above). 'always' + continueOnError: the schema is
    # (re)created when missing and safely ignored when tables already exist
    # across restarts.
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
    # Select Ollama as primary chat/embedding model to avoid DashScope/Ollama bean conflict
    # (both have matchIfMissing=true, so we must explicitly choose one)
    model:
      chat: ollama
      embedding: ollama
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: granite4.1:3b
          temperature: 0.7
      embedding:
        options:
          model: nomic-embed-text
    # Alibaba DashScope (Qwen) - cloud model, optional. Set DASHSCOPE_API_KEY env var to enable.
    # When the env var is absent the property resolves to an empty string, which disables
    # DashScope (see DashScopeEnabledCondition: enabled only when api-key is non-blank).
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        options:
          model: qwen-plus
          temperature: 0.7

server:
  port: 8080

# File-based persistence for the RAG vector store (SimpleVectorStore.save/load).
# Embeddings are computed once and reused on subsequent startups.
app:
  rag:
    # simple (default: in-memory + JSON file) | pgvector (external PostgreSQL,
    # the prod profile default — shared across instances, concurrent-safe).
    store: simple
    persistence-path: ./data/vector-store.json
    # Minimum cosine similarity (0..1) for a chunk to be used as RAG context.
    # Below this, the query is answered without retrieval instead of forcing
    # irrelevant context into the prompt (avoids hallucinated answers).
    similarity-threshold: 0.5
  cors:
    # Comma-separated list of origins allowed to call /ai/** from a browser
    # (default * = any origin, fine for a public demo; narrow it in production).
    allowed-origins: "*"
  auth:
    # When set, all /ai/** endpoints require an X-API-Key header with this value
    # (401 otherwise). Empty (default) = endpoints stay open, ideal for local
    # demos. For production, consider a full Spring Security/OIDC setup instead.
    api-key: ${APP_API_KEY:}
    # Fail-fast: when true, startup aborts unless an api-key is configured, so a
    # missing APP_API_KEY can never leave a deployment wide open by accident.
    # The prod profile sets this to true; never enable it without a key.
    required: false
  rate-limit:
    # Max requests per minute per client (X-API-Key header when present, else IP
    # address) on /ai/** endpoints. <= 0 disables. Backends (app.rate-limit.store):
    # memory (default, per instance) or redis (shared across replicas via an
    # atomic Lua token bucket; any Redis failure falls back to memory).
    # Redis itself is configured via spring.data.redis.* (host/port).
    store: memory
    requests-per-minute: 60
  prompt-guard:
    # Comma-separated, case-insensitive phrases rejected with 400 before the
    # message reaches the model (heuristic prompt-injection protection — not a
    # substitute for a real guardrails layer). "you are now" is intentionally
    # absent: it false-positives on ordinary sentences; re-add it here if wanted.
    blocked-phrases: ignore previous instructions, ignore all previous instructions, ignore the system prompt, disregard all previous instructions, new system prompt
  cache:
    semantic:
      # Semantic cache for /ai/chat: embeds the message and answers from the cache
      # when a similar past question exists. Opt-in (off by default) — embedding
      # every request costs tokens/CPU. Fail-safe: any error bypasses the cache.
      # In-memory, per instance; use a shared store for multi-instance deployments.
      enabled: false
      # Cosine similarity required for a cache hit (identical text ≈ 1.0).
      similarity-threshold: 0.95
      # Entry lifetime in seconds; entries are evicted lazily on store.
      ttl-seconds: 3600
      # Max cached entries before eviction.
      max-entries: 1000

# Observability: health/metrics + Prometheus scrape endpoint.
# Spring AI's chat observations (spring.ai.*) are exported automatically
# now that the Actuator's ObservationRegistry is on the classpath.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # Separate liveness/readiness groups for container probes: the app can be
      # alive while Ollama/DB/vector store are down. Health sub-paths stay
      # public (the ActuatorApiKeyFilter only guards metrics/prometheus).
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    # Redis is only a rate-limit backend with in-memory fail-open: its outage
    # must never flip health/readiness (the app keeps serving regardless).
    redis:
      enabled: false
