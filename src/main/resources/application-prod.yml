# Production: fail fast without auth, restricted CORS, env-driven URLs.
# Run with: SPRING_PROFILES_ACTIVE=prod APP_API_KEY=... CORS_ALLOWED_ORIGINS=https://app.example.com ./mvnw spring-boot:run
spring:
  config:
    activate:
      on-profile: prod
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://ollama:11434}
  # PostgreSQL: chat memory (same JDBC starter, schema auto-created) + pgvector.
  # No defaults: startup fails unless the operator provides them (fail fast).
  datasource:
    url: ${DATABASE_URL}
    username: ${PG_USER}
    password: ${PG_PASSWORD}
  # Shared rate-limit backend. No default host: startup fails unless the
  # operator provides REDIS_HOST (fail fast, like the other prod settings).
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
app:
  rag:
    # External, concurrent-safe store shared across instances.
    store: pgvector
  cors:
    # No default: startup fails unless the operator pins explicit origins.
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  auth:
    api-key: ${APP_API_KEY:}
    # Startup aborts when no key is configured (see security/ProdAuthGuard).
    required: true
  rate-limit:
    requests-per-minute: ${RATE_LIMIT_PER_MINUTE:60}
    # Shared quota across replicas (see spring.data.redis above).
    store: ${RATE_LIMIT_STORE:redis}
